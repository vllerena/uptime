# GitHub apaga los workflows programados de un repo público tras 60 días sin
# actividad. Un commit al mes mantiene vivo el monitor.
name: Keepalive

on:
  schedule:
    - cron: '0 15 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Commit mensual
        run: |
          date -u '+%Y-%m-%dT%H:%M:%SZ' > .keepalive
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .keepalive
          git commit -m 'keepalive: el monitor sigue programado' && git push
